    <link rel="stylesheet" href="css/app.css">
</head>

<body>
    <canvas id="game"></canvas>

    <!-- Title -->
    <div id="title" class="screen show">
        <div class="panel">
            <h1 class="logo">NOVA<span>STRIKE</span></h1>
            <p class="tagline">Five sectors. Five bosses. One pilot.</p>
            <button class="btn primary blink" data-action="start">Press <kbd>Enter</kbd> to launch</button>
            <div class="hi">High score <b id="titleHi">0</b></div>
            <div class="controls-slot"></div>
            <p class="credit">An HTML5 Canvas &amp; JavaScript space shooter by
                <a href="https://github.com/arindamad" target="_blank" rel="noopener">Arindam Sarkar</a>
                · <a href="https://github.com/arindamad/fighting-game" target="_blank" rel="noopener">Source on GitHub</a></p>
        </div>
    </div>

    <noscript>
        <div class="screen show">
            <div class="panel">
                <h1 class="logo">NOVA<span>STRIKE</span></h1>
                <p class="tagline">A free browser space shooter game built with JavaScript and HTML5 Canvas.</p>
                <p>Please enable JavaScript to play.</p>
            </div>
        </div>
    </noscript>

    <!-- Pause -->
    <div id="pause" class="screen">
        <div class="panel">
            <h2 class="heading">Paused</h2>
            <div class="btn-row">
                <button class="btn primary" data-action="resume">Resume <kbd>Esc</kbd></button>
                <button class="btn" data-action="restart">Restart <kbd>R</kbd></button>
                <button class="btn" data-action="title">Quit <kbd>T</kbd></button>
            </div>
            <div class="controls-slot"></div>
        </div>
    </div>

    <!-- Game over -->
    <div id="gameover" class="screen">
        <div class="panel">
            <h2 class="heading danger">Game Over</h2>
            <div id="newHi" class="new-hi">New high score!</div>
            <div class="stats">
                <div><span>Score</span><b id="finalScore">0</b></div>
                <div><span>Stage</span><b id="finalStage">1</b></div>
                <div><span>Max combo</span><b id="finalCombo">0</b></div>
            </div>
            <form id="saveNameGroup" class="save-row">
                <input type="text" required id="playerName" maxlength="16" autocomplete="off" placeholder="Enter your name for the leaderboard">
                <button type="submit" class="btn primary">Save</button>
            </form>
            <div id="saveStatus" class="save-status"></div>
            <div id="scoreBoard" class="score-board" style="display: none;">
                <table id="scoreTable">
                    <thead>
                        <tr><th>#</th><th>Pilot</th><th>Score</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="btn-row">
                <button class="btn primary" data-action="restart">Play again <kbd>R</kbd></button>
                <button class="btn" data-action="title">Menu <kbd>Esc</kbd></button>
            </div>
        </div>
    </div>

    <template id="controlsTpl">
        <div class="controls">
            <div><span>Move</span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd></div>
            <div><span>Fire (hold)</span><kbd>Space</kbd> / <kbd>J</kbd> / left click</div>
            <div><span>Switch laser</span><kbd>Q</kbd> / <kbd>Tab</kbd> / mouse wheel</div>
            <div><span>Pulse laser / Plasma beam</span><kbd>1</kbd> <kbd>2</kbd></div>
            <div><span>Nova bomb</span><kbd>B</kbd> / <kbd>X</kbd> / right click</div>
            <div><span>Precision move</span><kbd>Shift</kbd></div>
            <div><span>Pause</span><kbd>P</kbd> / <kbd>Esc</kbd></div>
            <div><span>Sound / Music / Fullscreen</span><kbd>M</kbd> <kbd>N</kbd> <kbd>F</kbd></div>
        </div>
        <p class="tips"><b>Pulse laser</b> sprays bolts and upgrades with <b class="p">P</b> pickups (Lv 4+ adds homing missiles).
            <b>Plasma beam</b> pierces every enemy in line and erases bullets, but drains energy and can overheat.
            Graze bullets for points, chain kills for a score multiplier, and destroy whole formations for bonus drops.</p>
    </template>

    <script src="js/audio.js"></script>
    <!-- The core Firebase JS SDK is always required and must be listed first -->
    <script src="https://www.gstatic.com/firebasejs/7.6.1/firebase.js"></script>
    <script src="js/form.js"></script>
    <script src="js/game.js"></script>
</body>

</html>
